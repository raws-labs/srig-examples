# An interactive Zephyr shell over whatever console the board exposes to the rig.
CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_UART="srig:~$ "

# The commands that make a board prove it is real: kernel version and uptime,
# the device list, and the chip's own id.
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_HWINFO=y
CONFIG_HWINFO_SHELL=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y

CONFIG_BOOT_BANNER=y
